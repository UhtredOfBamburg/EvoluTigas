<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              var reg = regs[i];
              var scriptURL = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
              if (scriptURL.indexOf('dev-sw.js') !== -1) {
                reg.unregister();
              } else {
                reg.update();
              }
            }
          }).catch(function() {});
        }
      })();
    </script>
    <title>EvoluTigas</title>
    <meta name="description" content="Plataforma médica para evolução clínica de enfermaria, ambulatório inteligente, transcrição de exames, calculadoras médicas e documentos hospitalares." />
