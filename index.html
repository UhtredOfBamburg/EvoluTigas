<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = String((e && e.message) || '');
          var file = String((e && e.filename) || '');
          if (msg === 'Script error.' || file.indexOf('@vite/client') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = String((e && e.reason && (e.reason.stack || e.reason.message)) || e.reason || '');
          if (reason.indexOf('@vite/client') !== -1 || reason.indexOf('WebSocket') !== -1 || reason.indexOf('Worker was destroyed') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              var reg = regs[i];
              var scriptURL = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
              if (scriptURL.indexOf('dev-sw.js') !== -1) {
                reg.unregister();
              }
            }
          }).catch(function() {});
        }
      })();
    </script>
    <title>EvoluTigas</title>
    <meta name="description" content="Plataforma médica para evolução clínica de enfermaria, ambulatório inteligente, transcrição de exames, calculadoras médicas e documentos hospitalares." />
    <meta property="og:title" content="EvoluTigas" />
    <meta property="og:description" content="Plataforma médica para evolução clínica de enfermaria, ambulatório inteligente, transcrição de exames, calculadoras médicas e documentos hospitalares." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EvoluTigas" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
